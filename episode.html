
<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Episodes Maker</title>
    <style>
        /* CSS Variables for Light/Dark Mode */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --container-bg: #ffffff;
            --border-color: #ccc;
            --input-bg: #ffffff;
            --list-bg: #f9f9f9;
            --hover-bg: #ecf0f1;
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --danger-color: #e74c3c;
            --danger-hover: #c0392b;
            --active-text: white;
            --sub-text: #7f8c8d;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --container-bg: #1e1e1e;
            --border-color: #444;
            --input-bg: #2d2d2d;
            --list-bg: #252525;
            --hover-bg: #333;
            --primary-color: #2980b9;
            --primary-hover: #3498db;
            --danger-color: #c0392b;
            --danger-hover: #e74c3c;
            --active-text: #ffffff;
            --sub-text: #aaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .header-bar {
            max-width: 1000px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: flex-end;
        }

        .theme-btn {
            background: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
            align-items: center;
        }

        input {
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: var(--primary-color);
        }
        input[type="text"] {
            flex: 1;
            min-width: 250px;
        }
        input[type="number"] {
            width: 160px;
        }

        button {
            padding: 12px 20px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-generate {
            background-color: var(--primary-color);
        }
        .btn-generate:hover {
            background-color: var(--primary-hover);
        }
        .btn-reset {
            background-color: var(--danger-color);
        }
        .btn-reset:hover {
            background-color: var(--danger-hover);
        }
        
        /* Player & List Section */
        .content-area {
            display: none;
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .player-container {
            flex: 2;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .episode-list {
            flex: 1;
            max-height: 450px;
            overflow-y: auto;
            background: var(--list-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
        }
        .episode-list h3 {
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }
        .ep-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
        }
        .ep-btn:hover {
            background: var(--hover-bg);
        }
        .ep-btn.active {
            background: var(--primary-color);
            color: var(--active-text);
            border-color: var(--primary-hover);
        }
        .ep-time {
            font-size: 12px;
            color: var(--sub-text);
            margin-top: 4px;
        }
        .ep-btn.active .ep-time {
            color: #ecf0f1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content-area {
                flex-direction: column;
            }
            .episode-list {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="theme-btn" onclick="toggleTheme()" id="themeToggleBtn">
            🌙 Dark Mode
        </button>
    </div>

    <div class="container">
        <h2>🎥 ক্লাস এপিসোড মেকার</h2>
        
        <div class="input-section">
            <input type="text" id="ytLink" placeholder="ইউটিউব ভিডিওর লিংক দিন">
            <input type="number" id="totalDuration" placeholder="মোট সময় (মিনিট)">
            <input type="number" id="epDuration" value="20" placeholder="প্রতি এপিসোড (মিনিট)">
            <button class="btn-generate" onclick="generateEpisodes()">এপিসোড তৈরি করুন</button>
            <button class="btn-reset" onclick="resetData()">রিসেট</button>
        </div>

        <div class="content-area" id="contentArea" style="display: none;">
            <div class="player-container">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
            
            <div class="episode-list" id="episodeList">
                <!-- এপিসোড লিস্ট এখানে আসবে -->
            </div>
        </div>
    </div>

    <script>
        // পেজ লোড হওয়ার সাথে সাথে LocalStorage থেকে ডেটা চেক করা
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadFromLocalStorage();
        });

        // ------------------ Theme Logic ------------------
        function toggleTheme() {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('appTheme', newTheme);
            updateThemeButtonText(newTheme);
        }

        function loadTheme() {
            let savedTheme = localStorage.getItem('appTheme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButtonText(savedTheme);
        }

        function updateThemeButtonText(theme) {
            let btn = document.getElementById('themeToggleBtn');
            if (theme === 'dark') {
                btn.innerHTML = '☀️ Light Mode';
            } else {
                btn.innerHTML = '🌙 Dark Mode';
            }
        }

        // ------------------ Episode Logic ------------------
        function extractVideoID(url) {
            let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]+)/);
            return (match && match[1].length === 11) ? match[1] : null;
        }

        function formatTime(seconds) {
            let h = Math.floor(seconds / 3600);
            let m = Math.floor((seconds % 3600) / 60);
            return (h > 0 ? h + "h " : "") + m + "m";
        }

        function generateEpisodes(isAutoLoad = false) {
            let url = document.getElementById('ytLink').value;
            let totalMins = parseInt(document.getElementById('totalDuration').value);
            let epMins = parseInt(document.getElementById('epDuration').value);
            
            let videoId = extractVideoID(url);

            if (!videoId || !totalMins || !epMins) {
                if (!isAutoLoad) alert("দয়া করে সঠিক লিংক এবং সময় ইনপুট দিন!");
                return;
            }

            // ডেটা লোকাল স্টোরেজে সেভ করা
            saveToLocalStorage(url, totalMins, epMins);

            let episodeListDiv = document.getElementById('episodeList');
            episodeListDiv.innerHTML = '<h3>📋 এপিসোড তালিকা</h3>'; 

            let totalEpisodes = Math.ceil(totalMins / epMins);

            for (let i = 0; i < totalEpisodes; i++) {
                let startSec = i * epMins * 60;
                let endSec = Math.min((i + 1) * epMins * 60, totalMins * 60);

                let btn = document.createElement('div');
                btn.className = 'ep-btn';
                btn.innerHTML = `
                    <strong>🎬 এপিসোড ${i + 1}</strong>
                    <div class="ep-time">${formatTime(startSec)} - ${formatTime(endSec)}</div>
                `;
                
                btn.onclick = function() {
                    playEpisode(videoId, startSec, endSec, this);
                };

                episodeListDiv.appendChild(btn);
            }

            document.getElementById('contentArea').style.display = 'flex';
            
            // অটোমেটিকভাবে প্রথম এপিসোড সিলেক্ট করা (যদি ম্যানুয়াল ক্লিক হয়)
            if(!isAutoLoad){
                let firstEpBtn = document.querySelector('.ep-btn');
                if (firstEpBtn) firstEpBtn.click();
            }
        }

        function playEpisode(videoId, start, end, clickedElement) {
            let iframe = document.getElementById('videoPlayer');
            iframe.src = `https://www.youtube.com/embed/${videoId}?start=${start}&end=${end}&autoplay=1&rel=0`;

            let allBtns = document.querySelectorAll('.ep-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));
            clickedElement.classList.add('active');
        }

        // ------------------ Storage & Reset Logic ------------------
        function saveToLocalStorage(url, total, ep) {
            let data = { ytLink: url, totalDuration: total, epDuration: ep };
            localStorage.setItem('classEpisodesData', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            let savedData = localStorage.getItem('classEpisodesData');
            if (savedData) {
                let data = JSON.parse(savedData);
                document.getElementById('ytLink').value = data.ytLink || '';
                document.getElementById('totalDuration').value = data.totalDuration || '';
                document.getElementById('epDuration').value = data.epDuration || '20';
                
                // ডেটা থাকলে নিজে থেকেই জেনারেট করবে
                if(data.ytLink && data.totalDuration) {
                    generateEpisodes(true);
                }
            }
        }

        function resetData() {
            if(confirm("আপনি কি সব ডেটা মুছে ফেলতে চান?")) {
                localStorage.removeItem('classEpisodesData');
                document.getElementById('ytLink').value = '';
                document.getElementById('totalDuration').value = '';
                document.getElementById('epDuration').value = '20';
                
                document.getElementById('contentArea').style.display = 'none';
                document.getElementById('videoPlayer').src = '';
                document.getElementById('episodeList').innerHTML = '';
            }
        }
    </script>
</body>
</html>
