<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJK | Cursed Energy Player</title>

    <style>
        :root {
            /* NEW COLOR PALETTE: Cursed Energy Theme */
            --bg-body: #050507;
            --bg-panel: #0d0d12;
            --bg-card: #16161f;
            --bg-card-hover: #1f1f2e;
            --accent: #00f2ff; /* Neon Cyan */
            --accent-dim: #0a3a40;
            --secondary: #8b5cf6; /* Cursed Purple */
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #222233;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- HEADER --- */
        header {
            background-color: var(--bg-panel);
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .brand { font-size: 1rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .brand span { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }
        
        .btn-reset {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 4px 12px;
            font-size: 0.7rem;
            border-radius: 20px;
            transition: 0.2s;
        }
        .btn-reset:active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* --- LAYOUT --- */
        .layout { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative; }

        .stage-area { width: 100%; background: #000; flex-shrink: 0; position: sticky; top: 0; z-index: 10; }

        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; width: 100%; }

        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Controls / Info */
        .meta-bar {
            padding: 15px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 4px; }
        .info p { color: var(--text-sub); font-size: 0.8rem; }

        .ext-btn {
            background: var(--secondary);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        
        /* Playlist Area */
        .playlist-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .season-tabs { display: flex; background: var(--bg-panel); padding: 5px; gap: 5px; }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.8rem;
            border-radius: 6px;
            transition: 0.3s;
        }
        .tab.active { color: #fff; background: var(--secondary); }

        .list-container { flex: 1; overflow-y: auto; padding: 12px; }

        .ep-card {
            background: var(--bg-card);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .ep-card.active { border-color: var(--accent); background: var(--bg-card-hover); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }
        
        .ep-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 8px; display: block; }
        .ep-card.active .ep-title { color: var(--accent); }

        .ep-tags { display: flex; gap: 6px; }
        .tag { font-size: 0.6rem; background: #000; padding: 3px 8px; border-radius: 4px; color: var(--secondary); border: 1px solid #222; }

        .progress-bg { height: 4px; background: #000; width: 100%; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 8px var(--accent); }

        #resume-banner {
            background: var(--secondary);
            color: white;
            padding: 12px 15px;
            font-size: 0.85rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .layout { flex-direction: row; }
            .stage-area { flex: 1; height: 100%; overflow-y: auto; }
            .video-wrapper { padding-bottom: 0; height: 70vh; }
            .playlist-area { width: 380px; border-left: 1px solid var(--border); }
            .meta-bar { flex-direction: row; justify-content: space-between; padding: 25px 40px; }
            .ext-btn { width: auto; padding: 10px 25px; }
        }
    </style>
</head>

            const state = getState();
            const epKey = `s${currentSeason}_e${currentIndex}`;
            state.history[epKey] = { time: Math.floor(time), duration: Math.floor(total) };
            state.last = { s: currentSeason, i: currentIndex };
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
            
            const activeCard = document.querySelector('.ep-card.active');
            if (activeCard) {
                const fill = activeCard.querySelector('.progress-fill');
                if (fill) fill.style.width = (time / total * 100) + '%';
            }
        }

        function resetHistory() {
            if(confirm("Exorcise your watch history?")) {
                localStorage.removeItem(STORE_KEY);
                location.reload();
            }
        }

        function loadSeason(num) {
            currentSeason = num;
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', (i + 1) === num);
            });
            renderList();
        }

        function renderList() {
            const list = document.getElementById('playlist');
            list.innerHTML = "";
            const state = getState();

            seasons[currentSeason].forEach((ep, idx) => {
                const isActive = (state.last && state.last.s === currentSeason && state.last.i === idx);
                const epKey = `s${currentSeason}_e${idx}`;
                const history = state.history[epKey];
                const pct = (history && history.duration > 0) ? (history.time / history.duration) * 100 : 0;

                const el = document.createElement('div');
                el.className = `ep-card ${isActive ? 'active' : ''}`;
                el.dataset.index = idx;
                el.onclick = () => playEpisode(idx);
                el.innerHTML = `
                    <span class="ep-title">${ep.t}</span>
                    <div class="ep-tags"><span class="tag">MKV</span><span class="tag">1080P</span></div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${pct}%"></div></div>
                `;
                list.appendChild(el);
                
                if(isActive && !window.hasScrolled) {
                    setTimeout(() => el.scrollIntoView({block: 'center', behavior: 'smooth'}), 500);
                    window.hasScrolled = true;
                }
            });
        }

        function playEpisode(index) {
            currentIndex = index;
            const ep = seasons[currentSeason][index];
            const state = getState();
            const epKey = `s${currentSeason}_e${index}`;

            document.getElementById('vid-title').innerText = ep.t;
            video.src = ep.u;
            document.getElementById('ext-player-btn').href = `intent:${ep.u}#Intent;action=android.intent.action.VIEW;type=video/*;S.title=${encodeURIComponent(ep.t)};end;`;

            const history = state.history[epKey];
            if(history) video.currentTime = history.time;

            video.play().catch(() => {});
            document.getElementById('resume-banner').style.display = 'none';
            
            document.querySelectorAll('.ep-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.querySelector(`.ep-card[data-index="${index}"]`);
            if(activeCard) activeCard.classList.add('active');
        }

        function resumeLast() {
            const state = getState();
            if(state.last) {
                loadSeason(state.last.s);
                playEpisode(state.last.i);
            }
        }

        video.addEventListener('timeupdate', () => {
            if(video.currentTime > 2 && Math.floor(video.currentTime) % 3 === 0) {
                saveProgress(video.currentTime, video.duration);
            }
        });

        video.addEventListener('ended', () => {
            saveProgress(video.duration, video.duration); 
            if(currentIndex < seasons[currentSeason].length - 1) playEpisode(currentIndex + 1);
        });

        window.onload = () => {
            const state = getState();
            if(state.last) {
                document.getElementById('resume-banner').style.display = 'flex';
                loadSeason(state.last.s);
            } else {
                loadSeason(1);
            }
        };
    </script>
</body>
</html>
