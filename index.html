<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory | Archive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
    <style>
        :root {
            --bg: #050507;
            --panel: #0d0d12;
            --accent: #00f2ff;
            --secondary: #8b5cf6;
            --text: #e2e8f0;
            --text-dim: #64748b;
            --border: #1f1f2e;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 650px; }

        header { padding: 50px 0 30px; text-align: left; }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--secondary);
            border-left: 3px solid var(--accent);
            padding-left: 15px;
        }

        .list { display: flex; flex-direction: column; gap: 12px; }

        .item {
            background: var(--panel);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
        }

        .item:hover {
            border-color: var(--accent);
            background: #16161f;
            transform: translateX(5px);
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: bold;
            flex-shrink: 0;
        }

        .content { flex: 1; }

        .name { font-weight: 700; font-size: 1rem; display: block; margin-bottom: 2px; }
        
        .desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }

        .type-tag {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
            margin-bottom: 4px;
            display: block;
        }

        .arrow { color: var(--text-dim); font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="hub-title">LOADING DIRECTORY...</h1>
    </header>
    <div class="list" id="links-list"></div>
</div>

<script>
    const JSON_URL = 'https://domainofarnoy.vercel.app/h.json'; 

    async function fetchLinks() {
        try {
            const res = await fetch(JSON_URL);
            const data = await res.json();
            
            document.getElementById('hub-title').innerText = data.hub_title;
            const list = document.getElementById('links-list');
            
            list.innerHTML = data.links.map(link => `
                <a href="${link.url}" class="item">
                    <div class="icon-box">/</div>
                    <div class="content">
                        <span class="type-tag">${link.type}</span>
                        <span class="name">${link.name}</span>
                        ${link.desc ? `<div class="desc">${link.desc}</div>` : ''}
                    </div>
                    <div class="arrow">→</div>
                </a>
            `).join('');
        } catch (e) {
            document.getElementById('hub-title').innerText = "CONNECTION FAILED";
        }
    }

    fetchLinks();
</script>
</body>
</html>
