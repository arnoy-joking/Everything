<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.css" rel="stylesheet">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .aspect-shorts { aspect-ratio: 9/16; }
        
        /* Animation Styles */
        #shorts-slider {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            width: 100%;
        }
        .short-slide {
            height: 100%;
            width: 100%;
            flex-shrink: 0;
            position: relative;
            background: #000;
        }
        
        /* Iframe reset */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* TV Centering Fix */
        .player-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 2rem;
        }

        .content-group {
            display: flex;
            align-items: flex-end;
            gap: 2rem;
            max-height: 90vh;
            height: 100%;
        }

        /* TV FOCUS STATE */
        .tv-focus {
            outline: none;
            box-shadow: 0 0 0 4px #dc2626, 0 0 20px rgba(220, 38, 38, 0.6);
            transform: scale(1.05);
            z-index: 50;
            transition: all 0.2s ease;
        }
        
        .sidebar-btn.tv-focus {
            background-color: white;
            color: black;
            box-shadow: 0 0 0 4px #dc2626; 
        }
        .sidebar-btn.tv-focus i {
            color: black;
        }
    </style>
</head>
<body class="bg-[#050505] text-white font-sans overflow-hidden">

    <div id="app" class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <nav class="w-24 bg-zinc-900/50 h-screen flex flex-col items-center py-6 border-r border-white/5 z-40 backdrop-blur-xl fixed left-0 top-0 hidden md:flex">
            <div class="mb-10">
                <div class="w-12 h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-600/40 cursor-pointer focusable-sidebar" onclick="location.reload()">
                    <i data-lucide="play" class="fill-white text-white"></i>
                </div>
            </div>
            <div class="flex-1 w-full space-y-4">
                <button class="sidebar-btn flex flex-col items-center justify-center p-4 w-full text-white transition-all rounded-xl focusable-sidebar" id="btn-home">
                    <div class="p-3 rounded-full bg-white/10 mb-1"><i data-lucide="home"></i></div>
                    <span class="text-[10px] font-medium">Home</span>
                </button>
                
                <a href="https://www.youtube.com/account" target="_blank" class="sidebar-btn flex flex-col items-center justify-center p-4 w-full text-zinc-400 hover:text-white transition-all rounded-xl focusable-sidebar" id="btn-login">
                    <div class="p-3 rounded-full bg-white/10 mb-1"><i data-lucide="user-circle"></i></div>
                    <span class="text-[10px] font-medium">Sign In</span>
                </a>

                <button class="sidebar-btn flex flex-col items-center justify-center p-4 w-full text-zinc-400 hover:text-white transition-all rounded-xl focusable-sidebar">
                    <div class="p-3 rounded-full bg-white/10 mb-1"><i data-lucide="settings"></i></div>
                    <span class="text-[10px] font-medium">Config</span>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 h-screen overflow-y-auto p-4 md:p-10 md:ml-24 scrollbar-hide" id="main-scroll">
            <header class="flex items-center justify-between mb-10 mt-4 md:mt-0">
                <div>
                    <h1 class="text-4xl font-black tracking-tight mb-2">Shorts TV</h1>
                    <div class="flex gap-4 items-center">
                        <span class="text-red-500 font-bold text-sm">Trending Now</span>
                        <div id="loading-badge" class="hidden px-2 py-0.5 rounded bg-zinc-800 text-xs text-zinc-400">Updating Feed...</div>
                        <div id="cookie-status" class="px-2 py-0.5 rounded bg-blue-900/50 text-xs text-blue-200 animate-pulse">Fetching Cookies...</div>
                    </div>
                </div>
            </header>

            <div id="video-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- Grid items injected by JS -->
            </div>
            
            <div id="load-more-trigger" class="h-32 w-full flex items-center justify-center text-zinc-600">
                <div class="animate-pulse">Loading more shorts...</div>
            </div>
        </main>

        <!-- Player Overlay -->
        <div id="player-overlay" class="fixed inset-0 z-[60] bg-[#0a0a0a] hidden">
            <div id="player-bg" class="absolute inset-0 overflow-hidden opacity-20 pointer-events-none transition-all duration-700"></div>
            
            <div class="player-wrapper">
                <button id="close-player" class="absolute left-6 top-6 p-4 rounded-full bg-zinc-900/50 text-white hover:bg-zinc-100 hover:text-black transition-all z-50 focusable-player">
                    <i data-lucide="chevron-left" size="32"></i>
                </button>

                <div class="content-group">
                    <div class="relative h-full aspect-shorts bg-black shadow-2xl rounded-2xl overflow-hidden ring-1 ring-white/10">
                        <div id="shorts-slider" class="flex flex-col"></div>
                    </div>

                    <div class="flex flex-col gap-4 items-start w-16 md:w-40 pb-2">
                        <div id="stats-container" class="flex flex-col gap-3 w-full opacity-0 transition-opacity duration-500"></div>
                        <div class="h-px w-full bg-white/10 my-2"></div>
                        <div class="flex flex-col gap-3 w-full">
                            <button id="btn-like" class="focusable-player p-3 md:p-4 bg-zinc-900/80 hover:bg-white hover:text-black rounded-xl border border-white/10 transition-colors flex items-center justify-center">
                                <i data-lucide="thumbs-up"></i>
                            </button>
                            <button id="mute-toggle" class="focusable-player p-3 md:p-4 bg-zinc-900/80 hover:bg-white hover:text-black rounded-xl border border-white/10 transition-colors flex items-center justify-center">
                                <i data-lucide="volume-2" id="mute-icon"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // --- CONFIGURATION ---
        const API_HOMEPAGE = "https://hmpgshorts.vercel.app/api/"; 
        const API_NEXT = "https://shortss-beryl.vercel.app/api"; 
        const DEFAULT_SEED_ID = "sP2N53Se2qY"; 

        // Gist URL for Raw Cookies (Auto-Update support)
        const GIST_COOKIE_URL = "https://gist.githubusercontent.com/arnoy-joking/d8ab574454c00269fa2449cfd116b6cd/raw";
        
        // --- STATE MANAGEMENT ---
        let COOKIES = ""; // Will be populated from Gist
        let videos = [];
        let currentIndex = 0;
        let isMuted = true;
        let isFetching = false;
        let playerOpen = false;
        let lastShortsApiId = DEFAULT_SEED_ID; 

        // --- TV NAVIGATION STATE ---
        let focusContext = 'sidebar'; 
        let focusIndex = 0; 
        const sidebarItems = document.querySelectorAll('.focusable-sidebar');

        // --- 0. COOKIE LOADER ---
        async function loadCookies() {
            const statusEl = document.getElementById('cookie-status');
            try {
                const response = await fetch(GIST_COOKIE_URL);
                if (!response.ok) throw new Error("Gist fetch failed");
                COOKIES = await response.text();
                
                statusEl.textContent = "System Ready";
                statusEl.className = "px-2 py-0.5 rounded bg-green-900/50 text-xs text-green-200";
                setTimeout(() => statusEl.classList.add('hidden'), 2000);
                
                // Start App
                fetchHomePage();
            } catch (error) {
                console.error("Cookie Load Error:", error);
                statusEl.textContent = "Cookie Error - Check Console";
                statusEl.className = "px-2 py-0.5 rounded bg-red-900/50 text-xs text-red-200";
            }
        }

        function parseNetscapeCookies(netscapeString) {
            const lines = netscapeString.split('\n');
            const cookieMap = [];
            lines.forEach(line => {
                if (!line || line.startsWith('#') || line.trim() === '') return;
                let parts = line.split('\t').filter(p => p !== '');
                if (parts.length < 7) parts = line.split(/\s+/).filter(p => p !== '');
                if (parts.length >= 6) {
                    const name = parts[5];
                    const value = parts.slice(6).join(''); 
                    if (name && value) cookieMap.push(`${name.trim()}=${value.trim()}`);
                }
            });
            return cookieMap.join('; ');
        }

        // --- 1. HOMEPAGE API (POST) ---
        async function fetchHomePage() {
            if (isFetching || !COOKIES) return; 
            isFetching = true;
            document.getElementById('loading-badge').classList.remove('hidden');

            try {
                const response = await fetch(API_HOMEPAGE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookiesContent: COOKIES })
                });

                if (!response.ok) throw new Error("Homepage API Fetch Failed");
                
                const result = await response.json();
                const rawData = result.data || [];
                const newVideos = rawData.map(v => ({
                    videoId: v.id ? v.id.replace('shorts-shelf-item-', '') : null,
                    title: v.title,
                    thumbnail: v.thumbnail,
                    views: v.views, 
                    type: 'home'
                })).filter(v => v.videoId);

                appendVideos(newVideos);

            } catch (err) {
                console.error("Home Fetch failed", err);
            } finally {
                isFetching = false;
                document.getElementById('loading-badge').classList.add('hidden');
            }
        }

        // --- 2. INFINITE SCROLL API (GET) ---
        async function fetchNextBatch() {
            if (isFetching || !COOKIES) return;
            isFetching = true;
            document.getElementById('loading-badge').classList.remove('hidden');

            try {
                const targetUrl = `https://www.youtube.com/shorts/${lastShortsApiId}`;
                const cookieHeader = parseNetscapeCookies(COOKIES);
                
                const requestUrl = `${API_NEXT}?url=${encodeURIComponent(targetUrl)}&cookies=${encodeURIComponent(cookieHeader)}`;
                
                const response = await fetch(requestUrl);
                const data = await response.json();

                const rawData = data.nextVideos || [];
                
                if (rawData.length > 0) {
                    lastShortsApiId = rawData[rawData.length - 1].videoId;
                }

                const newVideos = rawData
                    .filter(nv => !videos.some(ev => ev.videoId === nv.videoId))
                    .map(v => ({
                        videoId: v.videoId,
                        title: v.title || "Shorts",
                        thumbnail: v.thumbnail,
                        views: null, 
                        type: 'next'
                    }));

                if (newVideos.length > 0) {
                    appendVideos(newVideos);
                }

            } catch (err) {
                console.error("Next Batch failed", err);
            } finally {
                isFetching = false;
                document.getElementById('loading-badge').classList.add('hidden');
            }
        }

        function appendVideos(newVideos) {
            videos = [...videos, ...newVideos];
            renderGrid(newVideos);
            renderSliderPlaceholders(newVideos);
            if (focusContext === 'grid' && videos.length === newVideos.length) {
                focusIndex = 0;
                updateFocus();
            }
        }

        // --- UI RENDERERS ---
        function renderGrid(newVideos) {
            const grid = document.getElementById('video-grid');
            newVideos.forEach((video) => {
                const idx = videos.findIndex(v => v.videoId === video.videoId);
                const card = document.createElement('div');
                card.id = `card-${idx}`;
                card.className = "focusable-card relative group cursor-pointer aspect-shorts bg-zinc-800 rounded-xl overflow-hidden transition-all border border-white/5";
                
                const thumbUrl = video.thumbnail || `https://i.ytimg.com/vi/${video.videoId}/hq720.jpg`;
                
                const viewBadge = video.views 
                    ? `<div class="flex items-center gap-2 mb-2">
                         <div class="w-2 h-2 rounded-full bg-red-500"></div>
                         <span class="text-[10px] font-bold text-zinc-300 uppercase tracking-wide">${video.views}</span>
                       </div>`
                    : `<div class="mb-2 opacity-50"><span class="text-[10px] text-zinc-500">RECOMMENDED</span></div>`;

                card.innerHTML = `
                    <img src="${thumbUrl}" class="w-full h-full object-cover opacity-90 transition-opacity" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                    
                    <div class="absolute bottom-0 p-4 w-full">
                        ${viewBadge}
                        <h3 class="font-bold text-sm leading-tight text-white line-clamp-2 mb-1">${video.title}</h3>
                    </div>
                `;
                card.onclick = () => openPlayer(idx);
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderSliderPlaceholders(newVideos) {
            const slider = document.getElementById('shorts-slider');
            newVideos.forEach((video) => {
                const idx = videos.findIndex(v => v.videoId === video.videoId);
                const slide = document.createElement('div');
                slide.className = "short-slide relative flex items-center justify-center bg-black";
                slide.id = `slide-${idx}`;
                
                slide.innerHTML = `
                    <div class="absolute inset-0 z-0 pointer-events-none">
                        <img src="${video.thumbnail || `https://i.ytimg.com/vi/${video.videoId}/hq720.jpg`}" class="w-full h-full object-cover opacity-30 blur-2xl">
                    </div>
                    <div class="z-10 text-center pointer-events-none">
                        <div class="w-10 h-10 border-4 border-red-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    </div>
                    <div id="iframe-container-${idx}" class="absolute inset-0 z-20"></div>
                `;
                slider.appendChild(slide);
            });
        }

        // --- PLAYER LOGIC ---
        function openPlayer(index) {
            currentIndex = index;
            playerOpen = true;
            focusContext = 'player';
            document.getElementById('player-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
            updateActivePlayer();
            updateFocus();
        }

        function closePlayer() {
            playerOpen = false;
            focusContext = 'grid';
            focusIndex = currentIndex;
            document.getElementById('player-overlay').classList.add('hidden');
            document.body.style.overflow = '';
            document.querySelectorAll('[id^="iframe-container-"]').forEach(el => el.innerHTML = '');
            updateFocus();
        }

        function updateActivePlayer() {
            const slider = document.getElementById('shorts-slider');
            const video = videos[currentIndex];
            
            slider.style.transform = `translateY(-${currentIndex * 100}%)`;

            loadIframe(currentIndex, true);
            loadIframe(currentIndex + 1, false);
            loadIframe(currentIndex - 1, false);
            
            videos.forEach((_, idx) => {
                if (idx < currentIndex - 1 || idx > currentIndex + 1) {
                    const container = document.getElementById(`iframe-container-${idx}`);
                    if (container) container.innerHTML = '';
                }
            });

            const statsContainer = document.getElementById('stats-container');
            statsContainer.style.opacity = '0'; 
            setTimeout(() => {
                statsContainer.innerHTML = `
                    <img src="https://img.shields.io/youtube/views/${video.videoId}?style=for-the-badge&logo=youtube&color=27272a&labelColor=000000" class="w-full rounded opacity-80">
                    <img src="https://img.shields.io/youtube/likes/${video.videoId}?style=for-the-badge&logo=youtube&color=red&labelColor=000000" class="w-full rounded opacity-80">
                `;
                statsContainer.style.opacity = '1';
            }, 300);

            document.getElementById('player-bg').innerHTML = `
                <img src="${video.thumbnail || `https://i.ytimg.com/vi/${video.videoId}/hq720.jpg`}" class="w-full h-full object-cover blur-[80px] scale-150">
            `;

            if (currentIndex >= videos.length - 2) {
                fetchNextBatch();
            }
        }

        function loadIframe(index, shouldPlay) {
            if (index < 0 || index >= videos.length) return;
            
            const container = document.getElementById(`iframe-container-${index}`);
            if (!container.hasChildNodes()) {
                const videoId = videos[index].videoId;
                const origin = window.location.origin === 'file://' || !window.location.origin ? '*' : window.location.origin;

                const src = `https://www.youtube.com/embed/${videoId}?autoplay=${shouldPlay ? 1 : 0}&mute=${isMuted ? 1 : 0}&controls=0&modestbranding=1&rel=0&loop=1&playlist=${videoId}&enablejsapi=1&origin=${origin}&iv_load_policy=3&fs=0&playsinline=1`;
                
                const iframe = document.createElement('iframe');
                iframe.src = src;
                iframe.allow = "autoplay; encrypted-media; picture-in-picture";
                iframe.id = `yt-frame-${index}`;
                iframe.referrerPolicy = "no-referrer-when-downgrade";
                container.appendChild(iframe);
            } else {
                const iframe = document.getElementById(`yt-frame-${index}`);
                if (iframe && iframe.contentWindow) {
                    const command = shouldPlay ? 'playVideo' : 'pauseVideo';
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: command, args: [] }), '*');
                }
            }
        }

        // --- D-PAD NAVIGATION ---
        function getGridCols() {
            if (window.innerWidth >= 1280) return 5;
            if (window.innerWidth >= 1024) return 4;
            if (window.innerWidth >= 768) return 3;
            return 2;
        }

        function updateFocus() {
            document.querySelectorAll('.tv-focus').forEach(el => el.classList.remove('tv-focus'));

            if (focusContext === 'sidebar') {
                const sidebarEls = document.querySelectorAll('.focusable-sidebar');
                if (sidebarEls[focusIndex]) {
                    sidebarEls[focusIndex].classList.add('tv-focus');
                }
            } else if (focusContext === 'grid') {
                const card = document.getElementById(`card-${focusIndex}`);
                if (card) {
                    card.classList.add('tv-focus');
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            const cols = getGridCols();
            const sidebarLen = document.querySelectorAll('.focusable-sidebar').length;

            if (playerOpen) {
                if (e.key === 'ArrowDown') {
                    if (currentIndex < videos.length - 1) { currentIndex++; updateActivePlayer(); }
                } else if (e.key === 'ArrowUp') {
                    if (currentIndex > 0) { currentIndex--; updateActivePlayer(); }
                } else if (e.key === 'Enter') {
                    document.getElementById('mute-toggle').click();
                } else if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'BrowserBack') {
                    closePlayer();
                }
                return;
            }

            if (focusContext === 'sidebar') {
                if (e.key === 'ArrowDown') {
                    focusIndex = (focusIndex + 1) % sidebarLen;
                } else if (e.key === 'ArrowUp') {
                    focusIndex = (focusIndex - 1 + sidebarLen) % sidebarLen;
                } else if (e.key === 'ArrowRight') {
                    focusContext = 'grid';
                    focusIndex = 0; 
                } else if (e.key === 'Enter') {
                    document.querySelectorAll('.focusable-sidebar')[focusIndex].click();
                }
            } 
            else if (focusContext === 'grid') {
                if (e.key === 'ArrowRight') {
                    if (focusIndex < videos.length - 1) focusIndex++;
                } else if (e.key === 'ArrowLeft') {
                    if (focusIndex % cols === 0) {
                        focusContext = 'sidebar';
                        focusIndex = 0;
                    } else if (focusIndex > 0) {
                        focusIndex--;
                    }
                } else if (e.key === 'ArrowDown') {
                    if (focusIndex + cols < videos.length) {
                        focusIndex += cols;
                    } else {
                        fetchNextBatch();
                    }
                } else if (e.key === 'ArrowUp') {
                    if (focusIndex - cols >= 0) focusIndex -= cols;
                } else if (e.key === 'Enter') {
                    openPlayer(focusIndex);
                }
            }

            updateFocus();
        });

        document.getElementById('mute-toggle').onclick = () => {
            isMuted = !isMuted;
            document.getElementById('mute-icon').setAttribute('data-lucide', isMuted ? 'volume-x' : 'volume-2');
            lucide.createIcons();
            const currentIframe = document.getElementById(`yt-frame-${currentIndex}`);
            if (currentIframe && currentIframe.contentWindow) {
                const command = isMuted ? 'mute' : 'unMute';
                currentIframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: command, args: [] }), '*');
            }
        };

        document.getElementById('close-player').onclick = closePlayer;

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isFetching && videos.length > 0) {
                fetchNextBatch();
            }
        }, { threshold: 0.1 });
        
        observer.observe(document.getElementById('load-more-trigger'));

        window.onload = () => {
            lucide.createIcons();
            loadCookies(); // Load cookies first, then start app
            updateFocus();
        };
    </script>
</body>
</html>
