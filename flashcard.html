<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Card Catalog — Flashcard Renderer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<style>
  :root{
    --ink:#161A20;
    --ink-soft:#1E2530;
    --ink-softer:#262E3B;
    --ink-line: rgba(255,255,255,0.08);
    --ink-muted:#8A93A3;
    --ink-bright:#F1EEE6;
    --shadow-strong: rgba(0,0,0,.55);
    --shadow-soft: rgba(0,0,0,.4);

    --paper:#F4EFE2;
    --paper-shadow:#E4DCC8;
    --paper-line:#DED3B9;
    --paper-ink:#2A2620;
    --paper-ink-soft:#6B6250;

    --emerald:#2F6F52;
    --emerald-bright:#3E8E68;
    --amber:#C98A2C;
    --brick:#B24C4C;
    --violet:#5B5A9C;
    --azure:#3D7EA6;

    --radius-card: 14px;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

    --ease: cubic-bezier(.22,.9,.28,1);
  }

  html[data-theme="light"]{
    --ink:#E7E9EE;
    --ink-soft:#DADDE4;
    --ink-softer:#CBCFDA;
    --ink-line: rgba(20,25,35,0.12);
    --ink-muted:#5B6270;
    --ink-bright:#1B2028;
    --shadow-strong: rgba(20,25,35,.22);
    --shadow-soft: rgba(20,25,35,.12);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--ink-softer) 0%, transparent 60%),
      var(--ink);
    color:var(--ink-bright);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    transition:background .25s var(--ease), color .25s var(--ease);
  }
  ::selection{ background:var(--amber); color:#1a1408; }
  button{ font-family:inherit; }
  .view{ flex:1; display:flex; flex-direction:column; }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--ink-line);
    flex-wrap:wrap;
    position:relative;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .icon-btn{
    width:38px; height:38px; border-radius:9px;
    background:var(--ink-soft); border:1px solid var(--ink-line);
    color:var(--ink-bright); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
    transition:background .16s var(--ease), transform .12s var(--ease);
  }
  .icon-btn:hover{ background:var(--ink-softer); }
  .icon-btn:active{ transform:scale(.94); }
  .icon-btn svg{ width:17px; height:17px; }

  .brand{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .brand-mark{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.14em;
    color:var(--amber); border:1px solid rgba(201,138,44,.4);
    padding:2px 6px; border-radius:4px; text-transform:uppercase; flex:none;
  }
  .brand-text{ min-width:0; overflow:hidden; }
  .brand h1{
    font-family:var(--font-display); font-weight:600; font-size:17px; margin:0;
    letter-spacing:.01em; color:var(--ink-bright);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand .sub{ font-family:var(--font-mono); font-size:10px; color:var(--ink-muted); letter-spacing:.02em; }

  .topbar-center{ display:flex; align-items:center; gap:14px; }
  .stats{ display:flex; gap:14px; font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); }
  .stats .stat b{ color:var(--ink-bright); font-weight:600; }
  .stats .stat.good b{ color:var(--emerald-bright); }
  .quiz-timer{
    font-family:var(--font-mono); font-size:14px; font-weight:600;
    padding:5px 12px; border-radius:20px; background:var(--ink-soft);
    border:1px solid var(--ink-line); letter-spacing:.03em;
  }
  .quiz-timer.low{ color:var(--brick); border-color:var(--brick); }

  .topbar-right{ display:flex; gap:8px; align-items:center; flex-shrink:0; }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:8px; border:1px solid var(--ink-line);
    background:var(--ink-soft); color:var(--ink-bright); font-size:13px; font-weight:500;
    cursor:pointer; transition:background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease);
    white-space:nowrap;
    min-height:38px;
  }
  .btn:hover{ background:var(--ink-softer); border-color:rgba(255,255,255,0.16); }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--emerald); border-color:var(--emerald); color:#EFF7F1; }
  .btn.primary:hover{ background:var(--emerald-bright); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color:#e6a3a3; border-color:rgba(178,76,76,.5); }
  .btn.danger:hover{ background:rgba(178,76,76,.15); }
  .btn svg{ width:14px; height:14px; flex:none; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------- Library ---------- */
  .library-wrap{ flex:1; padding:24px 16px 60px; max-width:1080px; margin:0 auto; width:100%; }
  .folder-section{ margin-bottom:28px; }
  .folder-title{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-muted); margin-bottom:12px; display:flex; align-items:center; gap:10px;
  }
  .folder-title::after{ content:""; flex:1; height:1px; background:var(--ink-line); }

  .deck-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
  .deck-card{
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:14px;
    padding:16px; display:flex; flex-direction:column; gap:10px;
    transition:transform .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .deck-card:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,.18); box-shadow:0 14px 30px -14px rgba(0,0,0,.5); }
  .deck-card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .deck-card h3{
    font-family:var(--font-display); font-size:16px; font-weight:600; margin:0;
    line-height:1.3; color:var(--ink-bright);
  }
  .deck-card .count{ font-family:var(--font-mono); font-size:10px; color:var(--ink-muted); margin-top:2px; }

  .ring{
    width:38px; height:38px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--emerald-bright) calc(var(--pct,0)*1%), var(--ink-line) 0);
    position:relative;
  }
  .ring::after{
    content:attr(data-pct); position:absolute; inset:3px; border-radius:50%;
    background:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:8px; color:var(--ink-muted);
  }

  .deck-card-actions{ display:flex; gap:6px; margin-top:auto; flex-wrap:wrap; }
  .deck-card-actions .btn{ padding:7px 10px; font-size:12px; flex:1; justify-content:center; }
  .deck-card-actions .icon-only{ flex:none; width:34px; padding:7px; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;
    max-width:400px; color:var(--ink-muted); margin:50px auto; padding:0 16px;
  }
  .empty-state .glyph{
    width:56px; height:56px; border-radius:14px; border:1.5px dashed var(--ink-line);
    display:flex; align-items:center; justify-content:center; color:var(--amber);
  }
  .empty-state h2{ font-family:var(--font-display); font-size:22px; color:var(--ink-bright); margin:0; font-weight:600; }
  .empty-state p{ margin:0; font-size:13px; line-height:1.6; }
  .empty-actions{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; justify-content:center; }

  /* ---------- Session stage (study + quiz) ---------- */
  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 12px 8px; position:relative; }

  .progress-rail{ width:min(600px, 92vw); height:3px; background:var(--ink-line); border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--amber), var(--emerald-bright)); width:0%; transition:width .4s var(--ease); }

  .card-zone{ width:min(620px, 94vw); perspective:1800px; position:relative; min-height:360px; }
  .card-outer{ position:relative; width:100%; transform-style:preserve-3d; }
  @keyframes slideIn{ from{ opacity:0; transform:translateX(var(--slide-from,24px)) scale(.985);} to{ opacity:1; transform:translateX(0) scale(1);} }
  .card-outer.entering{ animation:slideIn .38s var(--ease); }

  .card-inner{
    position:relative; width:100%; min-height:360px; transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1); transform:rotate(-0.6deg);
  }
  .card-inner.flipped{ transform:rotate(-0.6deg) rotateY(180deg); }

  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--paper); border-radius:var(--radius-card);
    box-shadow:0 1px 0 var(--paper-shadow) inset, 0 18px 40px -12px var(--shadow-strong), 0 4px 10px -4px var(--shadow-soft);
    color:var(--paper-ink); padding:24px 28px 22px 46px; display:flex; flex-direction:column; overflow:auto;
    background-image:repeating-linear-gradient(180deg, transparent 0px, transparent 35px, var(--paper-line) 35px, var(--paper-line) 36px);
    background-position:0 88px;
    overscroll-behavior:contain;
  }
  .face.back{ transform:rotateY(180deg); }
  .face::before{
    content:""; position:absolute; left:14px; top:0; bottom:0; width:10px;
    background-image:
      radial-gradient(circle at 5px 46px, var(--ink) 4px, transparent 4.5px),
      radial-gradient(circle at 5px 46px, rgba(0,0,0,.18) 5.5px, transparent 6px),
      radial-gradient(circle at 5px calc(100% - 46px), var(--ink) 4px, transparent 4.5px),
      radial-gradient(circle at 5px calc(100% - 46px), rgba(0,0,0,.18) 5.5px, transparent 6px);
    opacity:.85;
  }

  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .card-tag{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:20px; font-weight:600; color:#fff; }
  .card-index{ font-family:var(--font-mono); font-size:10px; color:var(--paper-ink-soft); letter-spacing:.04em; }
  .card-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--paper-ink-soft); margin-bottom:6px; }

  .card-content{ font-family:var(--font-display); font-size:20px; line-height:1.5; font-weight:500; }
  .card-content.small{ font-size:16px; }
  .card-content strong{ font-weight:700; }
  .card-content code{ font-family:var(--font-mono); background:rgba(42,38,32,.07); padding:1px 5px; border-radius:4px; font-size:.82em; }

  .card-visual{ position:relative; height:130px; margin-top:10px; border-radius:9px; background:rgba(255,255,255,.3); border:1px solid var(--paper-shadow); overflow:hidden; }
  .card-visual canvas{ width:100%; height:100%; display:block; }

  .flip-hint{ margin-top:auto; padding-top:10px; font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; color:var(--paper-ink-soft); text-transform:uppercase; display:flex; align-items:center; gap:5px; opacity:.65; }

  /* MCQ */
  .mcq-options{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .mcq-option{
    display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:9px;
    border:1.5px solid var(--paper-shadow); background:rgba(255,255,255,.35); cursor:pointer;
    transition:border-color .16s var(--ease), background .16s var(--ease), transform .1s var(--ease);
    font-size:14px; line-height:1.45; color:var(--paper-ink); text-align:left;
    min-height:42px;
  }
  .mcq-option:hover:not(.locked){ border-color:var(--paper-ink-soft); background:rgba(255,255,255,.6); }
  .mcq-option:active:not(.locked){ transform:scale(.995); }
  .mcq-option .tab{
    font-family:var(--font-mono); font-weight:700; font-size:11px; width:22px; height:22px; border-radius:5px;
    background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px;
  }
  .mcq-option.correct{ border-color:var(--emerald); background:rgba(47,111,82,.14); }
  .mcq-option.correct .tab{ background:var(--emerald); color:#fff; }
  .mcq-option.wrong{ border-color:var(--brick); background:rgba(178,76,76,.13); }
  .mcq-option.wrong .tab{ background:var(--brick); color:#fff; }
  .mcq-option.locked{ cursor:default; }
  .mcq-option.dim{ opacity:.55; }

  .explanation{
    margin-top:12px; padding:12px 14px; border-radius:9px; background:rgba(201,138,44,.12);
    border:1px solid rgba(201,138,44,.35); font-size:13px; line-height:1.55; color:var(--paper-ink);
  }
  .explanation .exp-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); display:block; margin-bottom:4px; font-weight:700; }

  /* MCQ answer indicator on front */
  .mcq-result-banner{
    display:flex; align-items:center; gap:8px; margin-top:10px;
    padding:8px 12px; border-radius:8px; font-family:var(--font-mono);
    font-size:11px; font-weight:600; letter-spacing:.04em;
  }
  .mcq-result-banner.correct-banner{ background:rgba(47,111,82,.14); color:var(--emerald); border:1px solid rgba(47,111,82,.3); }
  .mcq-result-banner.wrong-banner{ background:rgba(178,76,76,.13); color:var(--brick); border:1px solid rgba(178,76,76,.3); }
  .mcq-result-banner svg{ width:16px; height:16px; flex:none; }

  /* Grade buttons */
  .grade-row{ display:flex; gap:8px; margin:4px 0 8px; opacity:0; max-height:0; overflow:hidden; transition:opacity .25s var(--ease), max-height .25s var(--ease); flex-wrap:wrap; justify-content:center; }
  .grade-row.show{ opacity:1; max-height:80px; }
  .grade-btn{ padding:8px 16px; border-radius:20px; font-size:12px; font-weight:600; border:1.5px solid; cursor:pointer; background:transparent; transition:transform .1s var(--ease), background .15s var(--ease); min-height:38px; }
  .grade-btn:active{ transform:scale(.96); }
  .grade-btn.good{ color:var(--emerald-bright); border-color:var(--emerald); }
  .grade-btn.good:hover{ background:rgba(47,111,82,.15); }
  .grade-btn.hard{ color:var(--amber); border-color:var(--amber); }
  .grade-btn.hard:hover{ background:rgba(201,138,44,.15); }
  .grade-btn.forgot{ color:#e08787; border-color:var(--brick); }
  .grade-btn.forgot:hover{ background:rgba(178,76,76,.15); }

  /* Controls */
  .controls{ display:flex; align-items:center; gap:10px; margin:16px 0 6px; }
  .nav-btn{
    width:44px; height:44px; border-radius:50%; background:var(--ink-soft); border:1px solid var(--ink-line);
    color:var(--ink-bright); display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .16s var(--ease), transform .12s var(--ease), opacity .16s var(--ease);
    flex-shrink:0;
  }
  .nav-btn:hover{ background:var(--ink-softer); }
  .nav-btn:active{ transform:scale(.94); }
  .nav-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .nav-btn svg{ width:18px; height:18px; }
  .flip-btn{
    padding:10px 20px; border-radius:24px; background:var(--ink-bright); color:var(--ink); border:none;
    font-weight:600; font-size:13px; cursor:pointer; letter-spacing:.01em; min-width:140px;
    transition:transform .12s var(--ease), opacity .16s var(--ease);
    min-height:42px;
  }
  .flip-btn:hover{ opacity:.92; }
  .flip-btn:active{ transform:scale(.97); }

  .kbd-hint{ font-family:var(--font-mono); font-size:10px; color:var(--ink-muted); letter-spacing:.02em; margin-top:4px; text-align:center; }
  .kbd-hint kbd{ background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:4px; padding:1px 5px; font-family:var(--font-mono); color:var(--ink-bright); font-size:9px; }

  footer.spacer{ height:30px; }

  /* ---------- Summary screen ---------- */
  .summary-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px 50px; }
  .summary-card{ width:min(560px, 92vw); text-align:center; }
  .summary-card .eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:8px; }
  .summary-card h2{ font-family:var(--font-display); font-size:28px; margin:0 0 5px; font-weight:600; }
  .summary-card .lead{ color:var(--ink-muted); font-size:13px; margin-bottom:22px; }
  .chip-row{ display:flex; justify-content:center; gap:10px; margin-bottom:24px; flex-wrap:wrap; }
  .chip{ padding:8px 14px; border-radius:12px; background:var(--ink-soft); border:1px solid var(--ink-line); min-width:80px; }
  .chip b{ display:block; font-size:20px; font-family:var(--font-mono); }
  .chip span{ font-size:10px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; }
  .chip.good b{ color:var(--emerald-bright); }
  .chip.hard b{ color:var(--amber); }
  .chip.forgot b{ color:#e08787; }

  .summary-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

  .missed-list{ text-align:left; margin:18px 0; max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .missed-item{ background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:10px; padding:10px 12px; font-size:12px; }
  .missed-item .q{ color:var(--ink-bright); margin-bottom:3px; }
  .missed-item .a{ color:var(--emerald-bright); font-size:12px; }

  /* ---------- Modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,16,.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s var(--ease); padding:12px; }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal{ background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:14px; width:min(580px, 100%); max-height:90vh; display:flex; flex-direction:column; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); transform:translateY(10px) scale(.98); transition:transform .22s var(--ease); }
  .modal-backdrop.open .modal{ transform:translateY(0) scale(1); }
  .modal.small{ width:min(380px,100%); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--ink-line); }
  .modal-head h3{ margin:0; font-family:var(--font-display); font-size:16px; font-weight:600; }
  .modal-close{ background:transparent; border:none; color:var(--ink-muted); cursor:pointer; font-size:20px; line-height:1; padding:4px; }
  .modal-close:hover{ color:var(--ink-bright); }
  .modal-body{ padding:14px 16px; overflow-y:auto; }
  .modal-body p{ font-size:12px; color:var(--ink-muted); line-height:1.6; margin:0 0 10px; }
  .modal-body textarea{ width:100%; min-height:160px; background:var(--ink); border:1px solid var(--ink-line); border-radius:10px; color:var(--ink-bright); font-family:var(--font-mono); font-size:11.5px; padding:12px; resize:vertical; line-height:1.6; }
  .modal-body textarea:focus{ outline:none; border-color:var(--amber); }
  .modal-body input[type=text]{ width:100%; background:var(--ink); border:1px solid var(--ink-line); border-radius:9px; color:var(--ink-bright); font-family:var(--font-body); font-size:13px; padding:9px 12px; margin-bottom:12px; }
  .modal-body input[type=text]:focus{ outline:none; border-color:var(--amber); }
  .field-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:5px; display:block; }
  .modal-error{ display:none; margin-top:8px; padding:8px 12px; border-radius:8px; background:rgba(178,76,76,.15); border:1px solid rgba(178,76,76,.4); color:#e6a3a3; font-size:11.5px; font-family:var(--font-mono); line-height:1.5; }
  .modal-error.show{ display:block; }

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ============================================================
     STORAGE HELPERS (personal, non-shared)
  ============================================================ */
  const memoryFallback = {};
  let storageWarned = false;
  async function sGet(key){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return Object.prototype.hasOwnProperty.call(memoryFallback,key) ? memoryFallback[key] : null; }
  }
  async function sSet(key, value){
    try{ await window.storage.set(key, value, false); return true; }
    catch(e){
      memoryFallback[key] = value;
      if(!storageWarned){ storageWarned = true; showToast('Saving to this session only — persistent storage unavailable.'); }
      return false;
    }
  }
  async function sDelete(key){
    try{ await window.storage.delete(key, false); }
    catch(e){ delete memoryFallback[key]; }
  }

  /* ============================================================
     SAFE MATH EXPRESSION PARSER (for function plots)
  ============================================================ */
  function tokenize(src){
    const toks = []; let i=0;
    while(i<src.length){
      const c = src[i];
      if(/\s/.test(c)){ i++; continue; }
      if(/[0-9.]/.test(c)){ let j=i; while(j<src.length && /[0-9.]/.test(src[j])) j++; toks.push({t:'num', v:parseFloat(src.slice(i,j))}); i=j; continue; }
      if(/[a-zA-Z_]/.test(c)){ let j=i; while(j<src.length && /[a-zA-Z_0-9]/.test(src[j])) j++; toks.push({t:'id', v:src.slice(i,j)}); i=j; continue; }
      if('+-*/^%(),'.includes(c)){ toks.push({t:c}); i++; continue; }
      throw new Error('Unexpected character: '+c);
    }
    return toks;
  }
  function parseExpr(src){
    const toks = tokenize(src); let p=0;
    const peek = () => toks[p];
    const next = () => toks[p++];
    function parseAdd(){ let n=parseMul(); while(peek() && (peek().t==='+'||peek().t==='-')){ const op=next().t; n={type:'bin',op,l:n,r:parseMul()}; } return n; }
    function parseMul(){ let n=parsePow(); while(peek() && (peek().t==='*'||peek().t==='/'||peek().t==='%')){ const op=next().t; n={type:'bin',op,l:n,r:parsePow()}; } return n; }
    function parsePow(){ let n=parseUnary(); if(peek() && peek().t==='^'){ next(); n={type:'bin',op:'^',l:n,r:parsePow()}; } return n; }
    function parseUnary(){ if(peek() && (peek().t==='-'||peek().t==='+')){ const op=next().t; return {type:'un',op,arg:parseUnary()}; } return parsePrimary(); }
    function parsePrimary(){
      const tk = peek();
      if(!tk) throw new Error('Unexpected end of expression');
      if(tk.t==='num'){ next(); return {type:'num', value:tk.v}; }
      if(tk.t==='('){ next(); const e=parseAdd(); if(!peek()||peek().t!==')') throw new Error('Expected )'); next(); return e; }
      if(tk.t==='id'){
        next(); const name = tk.v;
        if(peek() && peek().t==='('){
          next(); const args=[];
          if(peek() && peek().t!==')'){ args.push(parseAdd()); while(peek() && peek().t===','){ next(); args.push(parseAdd()); } }
          if(!peek()||peek().t!==')') throw new Error('Expected )'); next();
          return {type:'call', name, args};
        }
        return {type:'var', name};
      }
      throw new Error('Unexpected token');
    }
    const ast = parseAdd();
    if(p !== toks.length) throw new Error('Unexpected trailing input');
    return ast;
  }
  const MATH_CONST = { pi: Math.PI, e: Math.E };
  const MATH_FN = { sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos, atan:Math.atan,
    sqrt:Math.sqrt, abs:Math.abs, floor:Math.floor, ceil:Math.ceil, round:Math.round,
    exp:Math.exp, ln:Math.log, log:Math.log10, pow:Math.pow, min:Math.min, max:Math.max };
  function evalAst(node, x){
    switch(node.type){
      case 'num': return node.value;
      case 'var':
        if(node.name === 'x') return x;
        if(node.name in MATH_CONST) return MATH_CONST[node.name];
        throw new Error('Unknown variable: '+node.name);
      case 'un': { const v=evalAst(node.arg,x); return node.op==='-' ? -v : v; }
      case 'bin': {
        const l=evalAst(node.l,x), r=evalAst(node.r,x);
        if(node.op==='+') return l+r;
        if(node.op==='-') return l-r;
        if(node.op==='*') return l*r;
        if(node.op==='/') return l/r;
        if(node.op==='%') return l%r;
        if(node.op==='^') return Math.pow(l,r);
        break;
      }
      case 'call': {
        const args = node.args.map(a=>evalAst(a,x));
        if(node.name in MATH_FN) return MATH_FN[node.name](...args);
        throw new Error('Unknown function: '+node.name);
      }
    }
  }
  function compileExpr(src){ const ast = parseExpr(src); return (x) => evalAst(ast, x); }

  /* ============================================================
     VISUALS: canvas function plot + Chart.js data chart
  ============================================================ */
  function isLightTheme(){ return document.documentElement.getAttribute('data-theme') === 'light'; }

  function renderPlot(canvas, spec){
    if(!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.parentElement.clientWidth, cssH = canvas.parentElement.clientHeight;
    canvas.width = Math.max(1,cssW*dpr); canvas.height = Math.max(1,cssH*dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,cssW,cssH);
    const light = isLightTheme();
    const axisColor = light ? '#8b93a3' : '#5a6272';
    const gridColor = light ? 'rgba(20,25,35,0.1)' : 'rgba(255,255,255,0.09)';
    const curveColor = '#C98A2C';
    let fn;
    try{ fn = compileExpr(spec.expr); }
    catch(e){ ctx.fillStyle = axisColor; ctx.font = '11px monospace'; ctx.fillText('Invalid expression: '+spec.expr, 8, 18); return; }
    const xMin = (spec.xMin ?? -10), xMax = (spec.xMax ?? 10);
    const samples = spec.samples || 220;
    const pts = [];
    for(let i=0;i<=samples;i++){
      const x = xMin + (xMax-xMin)*i/samples;
      let y; try{ y = fn(x); }catch(e){ y = NaN; }
      pts.push([x,y]);
    }
    let yMin = spec.yMin, yMax = spec.yMax;
    if(yMin===undefined || yMax===undefined){
      const finite = pts.map(p=>p[1]).filter(v=>Number.isFinite(v));
      if(finite.length){ const lo=Math.min(...finite), hi=Math.max(...finite); const pad=(hi-lo)*0.15||1; yMin = yMin ?? (lo-pad); yMax = yMax ?? (hi+pad); }
      else { yMin=-1; yMax=1; }
    }
    const padL=34, padR=12, padT=10, padB=20;
    const plotW = cssW-padL-padR, plotH = cssH-padT-padB;
    const xToPx = x => padL + (x-xMin)/(xMax-xMin)*plotW;
    const yToPx = y => padT + (1-(y-yMin)/(yMax-yMin))*plotH;
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
    for(let i=0;i<=4;i++){ const gy = padT + plotH*i/4; ctx.beginPath(); ctx.moveTo(padL,gy); ctx.lineTo(cssW-padR,gy); ctx.stroke(); }
    ctx.strokeStyle = axisColor; ctx.lineWidth = 1.1;
    if(yMin<0 && yMax>0){ const zy=yToPx(0); ctx.beginPath(); ctx.moveTo(padL,zy); ctx.lineTo(cssW-padR,zy); ctx.stroke(); }
    if(xMin<0 && xMax>0){ const zx=xToPx(0); ctx.beginPath(); ctx.moveTo(zx,padT); ctx.lineTo(zx,cssH-padB); ctx.stroke(); }
    ctx.strokeStyle = curveColor; ctx.lineWidth = 2.3; ctx.lineJoin='round'; ctx.beginPath();
    let started = false;
    pts.forEach(([x,y]) => {
      if(!Number.isFinite(y)){ started=false; return; }
      const px=xToPx(x), py=yToPx(y);
      if(py < -50 || py > cssH+50){ started=false; return; }
      if(!started){ ctx.moveTo(px,py); started=true; } else { ctx.lineTo(px,py); }
    });
    ctx.stroke();
    ctx.fillStyle = axisColor; ctx.font = '9.5px "JetBrains Mono", monospace'; ctx.textAlign='left';
    ctx.fillText(xMin.toFixed(1), padL, cssH-5);
    ctx.textAlign='right'; ctx.fillText(xMax.toFixed(1), cssW-padR, cssH-5);
    ctx.textAlign='left'; ctx.fillText(yMax.toFixed(1), 3, padT+8); ctx.fillText(yMin.toFixed(1), 3, cssH-padB);
  }

  function renderChartVisual(canvas, spec){
    if(!canvas) return;
    if(typeof Chart === 'undefined'){
      const ctx = canvas.getContext('2d'); ctx.fillStyle='#8A93A3'; ctx.font='11px monospace'; ctx.fillText('Chart library unavailable', 8, 18); return;
    }
    const light = isLightTheme();
    const gridColor = light ? 'rgba(20,25,35,0.1)' : 'rgba(255,255,255,0.09)';
    const textColor = light ? '#5B6270' : '#8A93A3';
    const palette = ['#2F6F52','#C98A2C','#B24C4C','#5B5A9C','#3D7EA6'];
    const datasets = (spec.series||[]).map((s,i)=>({
      label: s.name || ('Series '+(i+1)), data: s.data,
      borderColor: palette[i%palette.length],
      backgroundColor: spec.kind==='bar' ? palette[i%palette.length] : palette[i%palette.length]+'33',
      tension:0.3, pointRadius: spec.kind==='scatter'?4:2, fill: spec.kind==='line'
    }));
    if(canvas._chartInstance){ try{ canvas._chartInstance.destroy(); }catch(e){} }
    try{
      canvas._chartInstance = new Chart(canvas.getContext('2d'), {
        type: spec.kind==='scatter' ? 'scatter' : (spec.kind==='bar' ? 'bar' : 'line'),
        data: { labels: spec.labels, datasets },
        options: {
          responsive:true, maintainAspectRatio:false, animation:{duration:300},
          plugins:{ legend:{ display: datasets.length>1, labels:{color:textColor, font:{size:10}, boxWidth:10 } } },
          scales:{ x:{ ticks:{color:textColor, font:{size:9.5}}, grid:{color:gridColor} },
                    y:{ ticks:{color:textColor, font:{size:9.5}}, grid:{color:gridColor} } }
        }
      });
    }catch(e){ console.warn('Chart render failed', e); }
  }

  /* ============================================================
     TEXT FORMATTING + KATEX
  ============================================================ */
  function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function formatText(raw){
    if(raw===undefined||raw===null) return '';
    let s = escapeHtml(String(raw));
    s = s.replace(/\n/g,'<br>');
    s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*(?!\*)([^*]+)\*(?!\*)/g,'$1<em>$2</em>');
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    return s;
  }
  function renderMath(el){
    if(window.renderMathInElement){
      try{
        renderMathInElement(el, {
          delimiters:[ {left:'$$',right:'$$',display:true}, {left:'\\[',right:'\\]',display:true},
                       {left:'$',right:'$',display:false}, {left:'\\(',right:'\\)',display:false} ],
          throwOnError:false
        });
      }catch(e){ console.warn('KaTeX render issue', e); }
    }
  }

  function showToast(msg){
    const toastEl = $('toast');
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2400);
  }

  function shuffleArray(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  const TAG_COLORS = ['#2F6F52','#C98A2C','#5B5A9C','#B24C4C','#3D7EA6'];
  function tagColor(tag){
    if(!tag) return '#6b6250';
    let h=0; for(let i=0;i<tag.length;i++) h = (h*31 + tag.charCodeAt(i)) >>> 0;
    return TAG_COLORS[h % TAG_COLORS.length];
  }

  /* ============================================================
     SAMPLE DECK
  ============================================================ */
  const SAMPLE_DECK = {
    title: "STEM Refresher",
    folder: "Sample Decks",
    cards: [
      { type:"basic", tag:"Calculus", front:"What is the derivative of $f(x) = x^3 - 4x$?", back:"$f'(x) = 3x^2 - 4$" },
      { type:"mcq", tag:"Algebra", question:"Which value of $x$ solves $3x - 7 = 8$?",
        options:["$x = 3$","$x = 5$","$x = -5$","$x = \\frac{15}{3}$"], answer:1,
        explanation:"Add 7 to both sides: $3x = 15$, then divide by 3: $x = 5$." },

        back:"$$KE = \\frac{1}{2}mv^2$$\nwhere $m$ is mass and $v$ is velocity." },
      { type:"basic", tag:"Chemistry", front:"Balance this combustion-style equation: $\\ce{H2 + O2 ->[?] H2O}$",
        back:"$$\\ce{2H2 + O2 -> 2H2O}$$" },
      { type:"mcq", tag:"Chemistry", question:"What is the pH of a neutral aqueous solution at 25°C?",
        options:["0","7","10","14"], answer:1, explanation:"Pure water at 25°C has $[H^+] = 10^{-7}$ M, giving pH $= 7$." },
      { type:"basic", tag:"Calculus", front:"Evaluate $\\displaystyle\\int_0^1 x^2\\,dx$.",
        back:"$$\\int_0^1 x^2\\,dx = \\left[\\frac{x^3}{3}\\right]_0^1 = \\frac{1}{3}$$" },
      { type:"basic", tag:"Precalculus", front:"What does the graph of $y=\\sin(x)$ look like over $[-2\\pi, 2\\pi]$?",
        back:"A smooth wave oscillating between $-1$ and $1$ with period $2\\pi$.",
        plot:{ expr:"sin(x)", xMin:-6.283, xMax:6.283, yMin:-1.4, yMax:1.4 } },
      { type:"mcq", tag:"Chemistry", question:"This titration curve shows pH vs. volume of titrant added. Roughly where is the equivalence point?",
        chart:{ kind:"line", labels:[0,5,10,15,20,25,30], series:[{name:"pH", data:[2,2.5,3.2,4.5,8.9,11,11.5]}] },
        options:["5 mL","15 mL","20 mL","30 mL"], answer:2,
        explanation:"The steep jump in pH between 15–20 mL marks the equivalence point, around 20 mL." },
      { type:"mcq", tag:"Number Theory", question:"Which of the following is a prime number?",
        options:["21","27","31","33"], answer:2,
        explanation:"31 has no divisors other than 1 and itself; the others factor as $3\\times7$, $3^3$, $3\\times11$." },
      { type:"basic", tag:"Linear Algebra", front:"What is the determinant of $\\begin{pmatrix}2 & 3\\\\ 1 & 4\\end{pmatrix}$?",
        back:"$\\det = (2)(4) - (3)(1) = 5$" }
    ]
  };

  /* ============================================================
     APP STATE
  ============================================================ */
  let theme = 'dark';
  let library = [];        // [{id,title,folder,count,createdAt,masteryPct}]
  let view = 'library';    // 'library' | 'session' | 'summary'
  let activeDeck = null;   // {id,title,folder,cards}
  let progressMap = {};    // cardIndex(string) -> grade, persisted per deck
  let session = null;      // shared study/quiz session
  let currentVisual = null; // {type:'plot'|'chart', spec, canvas}
  let pendingDeleteId = null;

  /* ============================================================
     THEME
  ============================================================ */
  function themeToggleHTML(){
    const sun = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
    const moon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    return `<button class="icon-btn" id="themeToggle" title="Toggle theme">${theme==='dark' ? sun : moon}</button>`;
  }
  async function applyTheme(t){
    theme = t;
    document.documentElement.setAttribute('data-theme', theme);
    await sSet('settings:theme', theme);
    if(currentVisual) redrawCurrentVisual();
    renderTopbarRightIcons();
  }
  function renderTopbarRightIcons(){
    const el = $('themeToggle');
    if(el) el.outerHTML = themeToggleHTML();
    const t = $('themeToggle');
    if(t) t.addEventListener('click', () => applyTheme(theme==='dark' ? 'light' : 'dark'));
  }
  function redrawCurrentVisual(){
    if(!currentVisual || !currentVisual.canvas || !document.body.contains(currentVisual.canvas)) return;
    if(currentVisual.type==='plot') renderPlot(currentVisual.canvas, currentVisual.spec);
    else renderChartVisual(currentVisual.canvas, currentVisual.spec);
  }
  window.addEventListener('resize', debounce(() => { if(currentVisual && currentVisual.type==='plot') redrawCurrentVisual(); }, 150));
  function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

  /* ============================================================
     VIEW SWITCHING
  ============================================================ */
  function setView(v){
    view = v;
    $('view-library').style.display = v==='library' ? 'flex' : 'none';
    $('view-session').style.display = v==='session' ? 'flex' : 'none';
    $('view-summary').style.display = v==='summary' ? 'flex' : 'none';
  }

  function renderTopbar(){
    const backBtn = $('backBtn');
    const titleEl = $('topTitle');
    const subEl = $('topSubtitle');
    const center = $('topbarCenter');
    const right = $('topbarRight');
    center.innerHTML = '';

    if(view==='library'){
      backBtn.hidden = true;
      titleEl.textContent = 'Card Catalog';
      subEl.textContent = library.length ? `${library.length} deck${library.length===1?'':'s'} in your library` : 'Import your first deck to begin';
      right.innerHTML = `<button class="btn primary" id="newDeckBtn">+ New deck</button>` + themeToggleHTML();
    } else if(view==='session'){
      backBtn.hidden = false;
      titleEl.textContent = activeDeck.title;
      if(session.kind==='quiz'){
        subEl.textContent = 'Timed quiz';
        center.innerHTML = `<div class="quiz-timer" id="quizTimerEl">--:--</div>`;
        right.innerHTML = themeToggleHTML();
      } else {
        subEl.textContent = session.mode==='review' ? 'Reviewing hard & forgotten cards' : `${activeDeck.cards.length} cards`;
        const goodCount = Object.values(session.grades).filter(g=>g==='good').length;
        center.innerHTML = `<div class="stats">
          <div class="stat"><b>${session.pos+1}</b>&nbsp;/&nbsp;${session.order.length}</div>
          <div class="stat good"><b>${goodCount}</b>&nbsp;good</div>
        </div>`;
        right.innerHTML = `<button class="btn ghost" id="shuffleBtn">Shuffle</button>` + themeToggleHTML();
      }
    } else if(view==='summary'){
      backBtn.hidden = false;
      titleEl.textContent = activeDeck.title;
      subEl.textContent = session.kind==='quiz' ? 'Quiz results' : 'Round complete';
      right.innerHTML = themeToggleHTML();
    }

    backBtn.onclick = goLibrary;
    const t = $('themeToggle');
    if(t) t.addEventListener('click', () => applyTheme(theme==='dark' ? 'light' : 'dark'));
    const newDeckBtn = $('newDeckBtn');
    if(newDeckBtn) newDeckBtn.addEventListener('click', openImportModal);
    const shuffleBtn = $('shuffleBtn');
    if(shuffleBtn) shuffleBtn.addEventListener('click', () => {
      session.order = shuffleArray(session.order);
      session.pos = 0;
      renderSessionCard('fwd');
    });
  }

  function goLibrary(){
    if(session && session.kind==='quiz' && session.timerId){ clearInterval(session.timerId); }
    session = null; activeDeck = null; currentVisual = null;
    setView('library');
    renderTopbar();
    renderLibrary();
  }

  /* ============================================================
     LIBRARY
  ============================================================ */
  async function loadLibrary(){
    const raw = await sGet('deckIndex');
    try{ library = raw ? JSON.parse(raw) : []; }catch(e){ library = []; }
    renderTopbar();
    renderLibrary();
  }
  async function saveLibraryIndex(){ await sSet('deckIndex', JSON.stringify(library)); }

  function renderLibrary(){
    const wrap = $('libraryWrap');
    if(!library.length){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="glyph"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="14" height="17" rx="2" transform="rotate(-8 3 5)"/><rect x="7" y="2" width="14" height="17" rx="2"/></svg></div>
          <h2>Your catalog is empty</h2>
          <p>Bring your own deck as JSON — LaTeX, chemistry notation, graphs, and multiple choice all supported — or start with a sample deck.</p>
          <div class="empty-actions">
            <button class="btn primary" id="loadSampleBtn">Load sample deck</button>
            <button class="btn" id="emptyImportBtn">Import JSON</button>
          </div>
        </div>`;
      $('loadSampleBtn').addEventListener('click', loadSampleDeck);
      $('emptyImportBtn').addEventListener('click', openImportModal);
      return;
    }
    const groups = {};
    library.forEach(d => { const f = d.folder || 'Unsorted'; (groups[f] = groups[f]||[]).push(d); });
    const folderNames = Object.keys(groups).sort((a,b)=> a==='Unsorted' ? 1 : b==='Unsorted' ? -1 : a.localeCompare(b));
    wrap.innerHTML = folderNames.map(fn => `
      <div class="folder-section">
        <div class="folder-title">${escapeHtml(fn)} · ${groups[fn].length}</div>
        <div class="deck-grid">
          ${groups[fn].map(d => deckCardHTML(d)).join('')}
        </div>
      </div>
    `).join('');
    library.forEach(d => {
      const studyBtn = wrap.querySelector(`[data-study="${d.id}"]`);
      const quizBtn = wrap.querySelector(`[data-quiz="${d.id}"]`);
      const exportBtn = wrap.querySelector(`[data-export="${d.id}"]`);
      const deleteBtn = wrap.querySelector(`[data-delete="${d.id}"]`);
      if(studyBtn) studyBtn.addEventListener('click', () => openDeck(d.id, 'study'));
      if(quizBtn) quizBtn.addEventListener('click', () => openDeck(d.id, 'quiz'));
      if(exportBtn) exportBtn.addEventListener('click', () => exportDeck(d.id));
      if(deleteBtn) deleteBtn.addEventListener('click', () => requestDeleteDeck(d.id, d.title));
    });
  }

  function deckCardHTML(d){
    const pct = Math.round(d.masteryPct || 0);
    return `
      <div class="deck-card">
        <div class="deck-card-head">
          <div><h3>${escapeHtml(d.title)}</h3><div class="count">${d.count} card${d.count===1?'':'s'}</div></div>
          <div class="ring" style="--pct:${pct}" data-pct="${pct}%"></div>
        </div>
        <div class="deck-card-actions">
          <button class="btn primary" data-study="${d.id}">Study</button>
          <button class="btn" data-quiz="${d.id}">Quiz</button>
          <button class="btn icon-only" data-export="${d.id}" title="Export JSON">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="btn icon-only danger" data-delete="${d.id}" title="Delete deck">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>`;
  }

  /* ============================================================
     DECK CRUD
  ============================================================ */
  function validateDeck(data){
    if(typeof data !== 'object' || data === null) throw new Error('Root value must be a JSON object.');
    if(!Array.isArray(data.cards) || data.cards.length === 0) throw new Error('Deck must include a non-empty "cards" array.');
    data.cards.forEach((c, i) => {
      if(!c || typeof c !== 'object') throw new Error(`Card ${i+1} must be an object.`);
      const type = c.type || 'basic';
      if(type === 'basic'){
        if(!c.front) throw new Error(`Card ${i+1} (basic) needs a "front" field.`);
        if(!c.back) throw new Error(`Card ${i+1} (basic) needs a "back" field.`);
      } else if(type === 'mcq'){
        if(!c.question) throw new Error(`Card ${i+1} (mcq) needs a "question" field.`);
        if(!Array.isArray(c.options) || c.options.length < 2) throw new Error(`Card ${i+1} (mcq) needs an "options" array with 2+ items.`);
        if(typeof c.answer !== 'number' || c.answer < 0 || c.answer >= c.options.length) throw new Error(`Card ${i+1} (mcq) needs a numeric "answer" index matching an option.`);
      } else {
        throw new Error(`Card ${i+1} has unknown type "${type}". Use "basic" or "mcq".`);
      }
    });
  }

  async function saveNewDeck(data, folderOverride){
    validateDeck(data);
    const id = uid();
    const deckObj = {
      id, title: data.title || 'Untitled Deck',
      folder: (folderOverride || data.folder || '').trim(),
      cards: data.cards.map(c => ({ type: c.type || 'basic', ...c }))
    };
    await sSet('deck:'+id, JSON.stringify(deckObj));
    await sSet('progress:'+id, JSON.stringify({ grades:{} }));
    library.push({ id, title: deckObj.title, folder: deckObj.folder, count: deckObj.cards.length, createdAt: Date.now(), masteryPct: 0 });
    await saveLibraryIndex();
    return id;
  }

  async function loadSampleDeck(){
    await saveNewDeck(JSON.parse(JSON.stringify(SAMPLE_DECK)));
    renderLibrary(); renderTopbar();
    showToast('Sample deck added to your library');
  }

  async function openDeck(id, mode){
    const raw = await sGet('deck:'+id);
    if(!raw){ showToast('Could not load that deck.'); return; }
    activeDeck = JSON.parse(raw);
    const praw = await sGet('progress:'+id);
    let prog = { grades:{} };
    try{ prog = praw ? JSON.parse(praw) : { grades:{} }; }catch(e){}
    progressMap = prog.grades || {};
    const allIdx = activeDeck.cards.map((_,i)=>i);
    if(mode === 'quiz') startQuizSession(allIdx);
    else startStudySession(allIdx, 'full');
  }

  async function persistProgressAndMastery(){
    await sSet('progress:'+activeDeck.id, JSON.stringify({ grades: progressMap }));
    const total = activeDeck.cards.length;
    const goodCount = Object.values(progressMap).filter(g=>g==='good').length;
    const pct = total ? Math.round((goodCount/total)*100) : 0;
    const entry = library.find(d => d.id === activeDeck.id);
    if(entry){ entry.masteryPct = pct; await saveLibraryIndex(); }
  }

  function exportDeck(id){
    (async () => {
      const raw = await sGet('deck:'+id);
      if(!raw){ showToast('Could not export that deck.'); return; }
      const deckObj = JSON.parse(raw);
      const clean = { title: deckObj.title, folder: deckObj.folder || undefined, cards: deckObj.cards };
      const blob = new Blob([JSON.stringify(clean, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = (deckObj.title || 'deck').replace(/[^a-z0-9\-_]+/gi,'_') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('Deck exported');
    })();
  }

  function requestDeleteDeck(id, title){
    pendingDeleteId = id;
    $('confirmTitle').textContent = 'Delete deck?';
    $('confirmText').textContent = `"${title}" and all of its study progress will be permanently removed. This can't be undone.`;
    $('confirmBackdrop').classList.add('open');
  }
  async function performDelete(){
    if(!pendingDeleteId) return;
    const id = pendingDeleteId; pendingDeleteId = null;
    await sDelete('deck:'+id);
    await sDelete('progress:'+id);
    library = library.filter(d => d.id !== id);
    await saveLibraryIndex();
    renderLibrary(); renderTopbar();
    showToast('Deck deleted');
  }

  /* ============================================================
     SESSION (STUDY + QUIZ SHARED ENGINE)
  ============================================================ */
  function startStudySession(indices, mode){
    session = { kind:'study', order: indices.slice(), pos:0, mode, grades:{}, mcqAnswers:{} };
    setView('session'); renderTopbar(); renderSessionCard(false);
  }
  function startQuizSession(indices){
    const order = shuffleArray(indices);
    const timeLimit = Math.max(60, order.length * 20);
    session = { kind:'quiz', order, pos:0, grades:{}, mcqAnswers:{}, timeLimit, remaining:timeLimit, startTime:Date.now(), timerId:null };
    setView('session'); renderTopbar(); renderSessionCard(false);
    session.timerId = setInterval(tickQuizTimer, 1000);
    updateQuizTimerDisplay();
  }
  function tickQuizTimer(){
    if(!session || session.kind !== 'quiz') return;
    session.remaining--;
    updateQuizTimerDisplay();
    if(session.remaining <= 0){ clearInterval(session.timerId); finalizeSession(); }
  }
  function updateQuizTimerDisplay(){
    const el = $('quizTimerEl');
    if(!el || !session) return;
    const m = Math.floor(Math.max(0,session.remaining)/60), s = Math.max(0,session.remaining)%60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('low', session.remaining <= 20);
  }

  function currentCard(){ return activeDeck.cards[session.order[session.pos]]; }

  function renderSessionCard(animateDir){
    const cardInner = $('cardInner'), faceFront = $('faceFront'), faceBack = $('faceBack');
    const flipBtn = $('flipBtn'), prevBtn = $('prevBtn'), nextBtn = $('nextBtn'), gradeRow = $('gradeRow'), kbdHint = $('kbdHint');
    cardInner.classList.remove('flipped');
    gradeRow.classList.remove('show');
    currentVisual = null;

    const c = currentCard();
    const idx = session.order[session.pos];
    const tagHtml = c.tag ? `<span class="card-tag" style="background:${tagColor(c.tag)}">${escapeHtml(c.tag)}</span>` : '<span></span>';
    const indexHtml = `<span class="card-index">CARD ${String(session.pos+1).padStart(3,'0')} / ${String(session.order.length).padStart(3,'0')}</span>`;
    const visualHTML = (c.chart || c.plot) ? `<div class="card-visual"><canvas class="visual-canvas"></canvas></div>` : '';

    if(c.type === 'mcq'){
      const alreadyAnswered = session.mcqAnswers[idx] !== undefined;
      flipBtn.style.display = alreadyAnswered ? 'inline-flex' : 'none';
      flipBtn.textContent = alreadyAnswered ? 'See explanation' : 'Reveal answer';
      faceFront.innerHTML = `
        <div class="card-head">${tagHtml}${indexHtml}</div>
        <div class="card-label">Multiple choice</div>
        <div class="card-content small">${formatText(c.question)}</div>
        ${visualHTML}
        <div class="mcq-options" id="mcqOptions"></div>
        <div id="mcqResultBanner"></div>
        <div class="flip-hint">${alreadyAnswered ? 'Tap card or press space to see explanation \u21BB' : 'Choose an answer'}</div>
      `;
      const optWrap = faceFront.querySelector('#mcqOptions');
      const letters = ['A','B','C','D','E','F'];
      c.options.forEach((opt,i) => {
        const btn = document.createElement('button');
        btn.className = 'mcq-option';
        btn.innerHTML = `<span class="tab">${letters[i]||i+1}</span><span>${formatText(opt)}</span>`;
        btn.addEventListener('click', () => selectMcqOption(idx, i));
        optWrap.appendChild(btn);
      });
      renderMath(faceFront);
      mountVisual(faceFront, c);
      if(alreadyAnswered) applyMcqState(idx, session.mcqAnswers[idx]);
      // Build back face with explanation
      buildMcqBackFace(c, idx, alreadyAnswered);
    } else {
      flipBtn.style.display = 'inline-flex';
      flipBtn.textContent = 'Reveal answer';
      faceFront.innerHTML = `
        <div class="card-head">${tagHtml}${indexHtml}</div>
        <div class="card-label">Question</div>
        <div class="card-content">${formatText(c.front)}</div>
        ${visualHTML}
        <div class="flip-hint">Tap card or press space ↻</div>
      `;
      faceBack.innerHTML = `
        <div class="card-head">${tagHtml}${indexHtml}</div>
        <div class="card-label">Answer</div>
        <div class="card-content">${formatText(c.back)}</div>
        <div class="flip-hint">Tap card to flip back ↻</div>
      `;
      renderMath(faceFront); renderMath(faceBack);
      mountVisual(faceFront, c);
      const graded = session.grades[idx];
      if(graded){ gradeRow.classList.add('show'); }
    }

    buildGradeRow(idx, c.type);

    if(c.type === 'mcq'){
      kbdHint.innerHTML = `<kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>1-${Math.min(c.options.length,6)}</kbd> choose &nbsp;·&nbsp; <kbd>space</kbd> flip for explanation` + (session.kind==='study' ? ` &nbsp;·&nbsp; <kbd>S</kbd> shuffle` : '');
    } else {
      kbdHint.innerHTML = `<kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>space</kbd> flip &nbsp;·&nbsp; <kbd>S</kbd> shuffle`;
    }
    if(session.kind === 'quiz') kbdHint.innerHTML = kbdHint.innerHTML.replace(/&nbsp;·&nbsp; <kbd>S<\/kbd> shuffle/,'');

    prevBtn.disabled = session.kind === 'quiz' ? true : session.pos === 0;
    nextBtn.disabled = false;
    nextBtn.title = session.pos === session.order.length - 1 ? 'Finish' : 'Next (→)';

    const outer = $('cardOuter');
    if(animateDir){
      outer.classList.remove('entering'); void outer.offsetWidth;
      outer.style.setProperty('--slide-from', animateDir === 'back' ? '-24px' : '24px');
      outer.classList.add('entering');
    }
    $('progressFill').style.width = `${((session.pos+1)/session.order.length)*100}%`;
    renderTopbar();
  }

  function mountVisual(container, c){
    const canvas = container.querySelector('.visual-canvas');
    if(!canvas) return;
    if(c.plot){ currentVisual = { type:'plot', spec:c.plot, canvas }; requestAnimationFrame(()=>renderPlot(canvas, c.plot)); }
    else if(c.chart){ currentVisual = { type:'chart', spec:c.chart, canvas }; requestAnimationFrame(()=>renderChartVisual(canvas, c.chart)); }
  }

  function buildGradeRow(idx, type){
    const gradeRow = $('gradeRow');
    if(type !== 'basic'){ gradeRow.innerHTML=''; gradeRow.classList.remove('show'); return; }
    if(session.kind === 'study'){
      gradeRow.innerHTML = `
        <button class="grade-btn forgot" data-g="forgot">✗ Forgot</button>
        <button class="grade-btn hard" data-g="hard">◐ Hard</button>
        <button class="grade-btn good" data-g="good">✓ Good</button>`;
    } else {
      gradeRow.innerHTML = `
        <button class="grade-btn forgot" data-g="forgot">✗ Incorrect</button>
        <button class="grade-btn good" data-g="good">✓ Correct</button>`;
    }
    gradeRow.querySelectorAll('.grade-btn').forEach(b => b.addEventListener('click', () => gradeCard(idx, b.dataset.g)));
    if(session.grades[idx]) gradeRow.classList.add('show');
  }

  function gradeCard(idx, grade){
    session.grades[idx] = grade;
    if(session.kind === 'study'){
      showToast(grade === 'good' ? 'Marked as good' : grade === 'hard' ? 'Marked as hard' : 'Marked as forgot');
      setTimeout(goNext, 280);
    }
    // quiz: require manual Next (already handled by user)
  }

  function selectMcqOption(cardIdx, optionIdx){
    if(session.mcqAnswers[cardIdx] !== undefined) return;
    session.mcqAnswers[cardIdx] = optionIdx;
    const c = activeDeck.cards[cardIdx];
    session.grades[cardIdx] = (optionIdx === c.answer) ? 'good' : 'forgot';
    applyMcqState(cardIdx, optionIdx);
    renderTopbar();
  }

  function applyMcqState(cardIdx, chosenIdx){
    const c = activeDeck.cards[cardIdx];
    const faceFront = $('faceFront');
    const flipBtn = $('flipBtn');
    const opts = faceFront.querySelectorAll('.mcq-option');
    const isCorrect = chosenIdx === c.answer;
    const letters = ['A','B','C','D','E','F'];
    opts.forEach((btn,i) => {
      btn.classList.add('locked');
      if(i === c.answer) btn.classList.add('correct');
      else if(i === chosenIdx) btn.classList.add('wrong');
      else btn.classList.add('dim');
    });
    // Show result banner on front
    const banner = faceFront.querySelector('#mcqResultBanner');
    if(banner){
      const chosenLabel = letters[chosenIdx] || (chosenIdx+1);
      const correctLabel = letters[c.answer] || (c.answer+1);
      if(isCorrect){
        banner.innerHTML = '<div class="mcq-result-banner correct-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Correct!</div>';
      } else {
        banner.innerHTML = '<div class="mcq-result-banner wrong-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Incorrect \u2014 answer is ' + correctLabel + '</div>';
      }
    }
    // Update flip hint
    const hint = faceFront.querySelector('.flip-hint');
    if(hint) hint.textContent = 'Tap card or press space to see explanation \u21BB';
    // Show flip button so user can flip to see explanation
    flipBtn.style.display = 'inline-flex';
    flipBtn.textContent = 'See explanation';
    // Build back face
    buildMcqBackFace(c, cardIdx, true);
  }

  function buildMcqBackFace(c, idx, alreadyAnswered){
    const faceBack = $('faceBack');
    const letters = ['A','B','C','D','E','F'];
    const isCorrect = alreadyAnswered && session.mcqAnswers[idx] === c.answer;
    const chosenLabel = alreadyAnswered ? letters[session.mcqAnswers[idx]] || (session.mcqAnswers[idx]+1) : '';
    const correctLabel = letters[c.answer] || (c.answer+1);
    let resultSummary = '';
    if(alreadyAnswered){
      if(isCorrect){
        resultSummary = '<div class="mcq-result-banner correct-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Correct! You chose ' + chosenLabel + '</div>';
      } else {
        resultSummary = '<div class="mcq-result-banner wrong-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Incorrect. You chose ' + chosenLabel + ', correct is ' + correctLabel + '</div>';
      }
    }
    let explanationHTML = '';
    if(c.explanation){
      explanationHTML = '<div class="explanation"><span class="exp-label">Explanation</span><div>' + formatText(c.explanation) + '</div></div>';
    }
    const tagHtml2 = c.tag ? '<span class="card-tag" style="background:' + tagColor(c.tag) + '">' + escapeHtml(c.tag) + '</span>' : '<span></span>';
    const indexHtml2 = '<span class="card-index">CARD ' + String(session.pos+1).padStart(3,'0') + ' / ' + String(session.order.length).padStart(3,'0') + '</span>';
    faceBack.innerHTML = `
      <div class="card-head">${tagHtml2}${indexHtml2}</div>
      <div class="card-label">Answer & Explanation</div>
      <div class="card-content small" style="font-size:14px;margin-bottom:8px;">${formatText(c.question)}</div>
      ${resultSummary}
      <div style="margin:6px 0;font-size:13px;color:var(--paper-ink-soft);"><strong style="color:var(--emerald);">Correct answer: ${correctLabel}</strong> \u2014 ${formatText(c.options[c.answer])}</div>
      ${explanationHTML}
      <div class="flip-hint">Tap card to flip back \u21BB</div>
    `;
    renderMath(faceBack);
  }

  function toggleFlip(){
    const c = currentCard();
    if(!c) return;
    if(c.type === 'mcq' && session.mcqAnswers[session.order[session.pos]] === undefined) return;
    const cardInner = $('cardInner'), flipBtn = $('flipBtn'), gradeRow = $('gradeRow');
    const flipped = cardInner.classList.toggle('flipped');
    if(c.type === 'basic'){
      flipBtn.textContent = flipped ? 'Show question' : 'Reveal answer';
      gradeRow.classList.toggle('show', flipped);
    } else if(c.type === 'mcq'){
      flipBtn.textContent = flipped ? 'Back to question' : 'See explanation';
    }
  }

  function goNext(){
    if(!session) return;
    if(session.pos < session.order.length - 1){ session.pos++; renderSessionCard('fwd'); }
    else { finalizeSession(); }
  }
  function goPrev(){
    if(!session || session.kind === 'quiz') return;
    if(session.pos > 0){ session.pos--; renderSessionCard('back'); }
  }

  async function finalizeSession(){
    if(session.kind === 'quiz' && session.timerId) clearInterval(session.timerId);
    // fill skipped
    session.order.forEach(idx => { if(!session.grades[idx]) session.grades[idx] = 'skipped'; });

    if(session.kind === 'study'){
      session.order.forEach(idx => { progressMap[idx] = session.grades[idx]; });
      await persistProgressAndMastery();
      renderRoundCompleteSummary();
    } else {
      renderQuizResultsSummary();
    }
  }

  /* ============================================================
     SUMMARY SCREENS
  ============================================================ */
  function renderRoundCompleteSummary(){
    setView('summary'); renderTopbar();
    const vals = session.order.map(idx => session.grades[idx]);
    const good = vals.filter(g=>g==='good').length;
    const hard = vals.filter(g=>g==='hard').length;
    const forgot = vals.filter(g=>g==='forgot' || g==='skipped').length;
    const reviewSet = session.order.filter(idx => session.grades[idx] !== 'good');

    $('summaryContent').innerHTML = `
      <div class="eyebrow">Round complete</div>
      <h2>${good === session.order.length ? 'Perfect round' : 'Nice work'}</h2>
      <div class="lead">You went through ${session.order.length} card${session.order.length===1?'':'s'} in ${escapeHtml(activeDeck.title)}.</div>
      <div class="chip-row">
        <div class="chip good"><b>${good}</b><span>Good</span></div>
        <div class="chip hard"><b>${hard}</b><span>Hard</span></div>
        <div class="chip forgot"><b>${forgot}</b><span>Forgot</span></div>
      </div>
      <div class="summary-actions">
        ${reviewSet.length ? `<button class="btn primary" id="reviewBtn">Review Hard &amp; Forgot (${reviewSet.length})</button>` : ''}
        <button class="btn" id="restartBtn">Study full deck again</button>
        <button class="btn ghost" id="libBtn">Back to library</button>
      </div>
    `;
    const reviewBtn = $('reviewBtn');
    if(reviewBtn) reviewBtn.addEventListener('click', () => startStudySession(reviewSet, 'review'));
    $('restartBtn').addEventListener('click', () => startStudySession(shuffleArray(activeDeck.cards.map((_,i)=>i)), 'full'));
    $('libBtn').addEventListener('click', goLibrary);
  }

  function renderQuizResultsSummary(){
    setView('summary'); renderTopbar();
    const good = session.order.filter(idx => session.grades[idx] === 'good').length;
    const total = session.order.length;
    const pct = Math.round((good/total)*100);
    const timeTaken = session.timeLimit - Math.max(0,session.remaining);
    const mm = Math.floor(timeTaken/60), ss = timeTaken%60;
    const missed = session.order.filter(idx => session.grades[idx] !== 'good');

    const missedHTML = missed.length ? `<div class="missed-list">${missed.map(idx => {
      const c = activeDeck.cards[idx];
      const q = c.type === 'mcq' ? c.question : c.front;
      const a = c.type === 'mcq' ? c.options[c.answer] : c.back;
      return `<div class="missed-item"><div class="q">${formatText(q)}</div><div class="a">Answer: ${formatText(a)}</div></div>`;
    }).join('')}</div>` : '';

    $('summaryContent').innerHTML = `
      <div class="eyebrow">Quiz results</div>
      <h2>${good}/${total} correct</h2>
      <div class="lead">${pct}% score · finished in ${mm}m ${ss}s</div>
      ${missedHTML}
      <div class="summary-actions">
        ${missed.length ? `<button class="btn primary" id="studyMissedBtn">Study missed cards</button>` : ''}
        <button class="btn" id="retakeBtn">Retake quiz</button>
        <button class="btn ghost" id="libBtn">Back to library</button>
      </div>
    `;
    renderMath($('summaryContent'));
    const studyMissedBtn = $('studyMissedBtn');
    if(studyMissedBtn) studyMissedBtn.addEventListener('click', () => startStudySession(missed, 'review'));
    $('retakeBtn').addEventListener('click', () => startQuizSession(activeDeck.cards.map((_,i)=>i)));
    $('libBtn').addEventListener('click', goLibrary);
  }

  /* ============================================================
     INTERACTIONS
  ============================================================ */
  $('cardOuter').addEventListener('click', (e) => {
    if(e.target.closest('.mcq-option')) return;
    const c = currentCard && session ? currentCard() : null;
    if(!c) return;
    if(c.type === 'basic') toggleFlip();
    else if(c.type === 'mcq' && session.mcqAnswers[session.order[session.pos]] !== undefined) toggleFlip();
  });
  $('flipBtn').addEventListener('click', toggleFlip);
  $('prevBtn').addEventListener('click', goPrev);
  $('nextBtn').addEventListener('click', goNext);

  document.addEventListener('keydown', (e) => {
    if($('modalBackdrop').classList.contains('open') || $('confirmBackdrop').classList.contains('open')) return;
    if(view !== 'session' || !session) return;
    if(e.key === 'ArrowRight'){ goNext(); }
    else if(e.key === 'ArrowLeft'){ goPrev(); }
    else if(e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      const c = currentCard();
      if(c && c.type === 'mcq' && session.mcqAnswers[session.order[session.pos]] === undefined) return;
      toggleFlip();
    }
    else if(e.key.toLowerCase() === 's' && session.kind==='study'){ session.order = shuffleArray(session.order); session.pos = 0; renderSessionCard('fwd'); }
    else if(/^[1-6]$/.test(e.key)){
      const c = currentCard();
      if(c && c.type === 'mcq'){
        const i = parseInt(e.key,10) - 1;
        if(i < c.options.length) selectMcqOption(session.order[session.pos], i);
      }
    }
  });

  /* ============================================================
     IMPORT MODAL
  ============================================================ */
  function openImportModal(){
    $('modalBackdrop').classList.add('open');
    $('modalError').classList.remove('show');
    $('folderInput').value = '';
  }
  function closeImportModal(){ $('modalBackdrop').classList.remove('open'); }
  $('importBtnFallback');
  $('modalClose').addEventListener('click', closeImportModal);
  $('modalBackdrop').addEventListener('click', (e) => { if(e.target === $('modalBackdrop')) closeImportModal(); });
  $('sampleBtn').addEventListener('click', () => { $('jsonInput').value = JSON.stringify(SAMPLE_DECK, null, 2); });
  $('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { $('jsonInput').value = reader.result; };
    reader.onerror = () => { $('modalError').textContent = 'Could not read that file.'; $('modalError').classList.add('show'); };
    reader.readAsText(file);
  });
  $('loadJsonBtn').addEventListener('click', async () => {
    const raw = $('jsonInput').value.trim();
    const modalError = $('modalError');
    if(!raw){ modalError.textContent = 'Paste or upload JSON first.'; modalError.classList.add('show'); return; }
    let data;
    try{ data = JSON.parse(raw); }
    catch(err){ modalError.textContent = 'Invalid JSON: ' + err.message; modalError.classList.add('show'); return; }
    try{ await saveNewDeck(data, $('folderInput').value); }
    catch(err){ modalError.textContent = err.message; modalError.classList.add('show'); return; }
    modalError.classList.remove('show');
    closeImportModal();
    renderLibrary(); renderTopbar();
    showToast('Deck saved to your library');
  });

  /* ============================================================
     CONFIRM MODAL
  ============================================================ */
  $('confirmClose').addEventListener('click', () => { $('confirmBackdrop').classList.remove('open'); pendingDeleteId = null; });
  $('confirmNo').addEventListener('click', () => { $('confirmBackdrop').classList.remove('open'); pendingDeleteId = null; });
  $('confirmYes').addEventListener('click', async () => { $('confirmBackdrop').classList.remove('open'); await performDelete(); });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if($('modalBackdrop').classList.contains('open')) closeImportModal();
      if($('confirmBackdrop').classList.contains('open')){ $('confirmBackdrop').classList.remove('open'); pendingDeleteId = null; }
    }
  });

  /* ============================================================
     INIT
  ============================================================ */
  async function init(){
    const savedTheme = await sGet('settings:theme');
    theme = savedTheme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    setView('library');
    await loadLibrary();
  }
  init();

})();
</script>
</body>
</html>
